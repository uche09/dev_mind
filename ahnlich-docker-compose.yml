services:
  ahnlich_db:
    image: ghcr.io/deven96/ahnlich-db:latest
    command: >
      "ahnlich-db run --host 0.0.0.0"
    ports:
      - "1369:1369"

  
  ahnlich_ai:
    image: ghcr.io/deven96/ahnlich-ai:latest
    command: >
      "ahnlich-ai run --db-host ahnlich_db --host 0.0.0.0 --supported-models jina-embeddings-v2-base-code"
    ports:
      - "1370:1370"
    depends_on:
      - ahnlich_db